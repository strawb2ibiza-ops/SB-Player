name: Publish SB Player v0.6.12 Release

on:
  workflow_run:
    workflows:
      - Flutter checks
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  publish:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Resolve verified main build
        id: build
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          if [ -n "$EVENT_RUN_ID" ] && [ "$EVENT_RUN_ID" != "null" ]; then
            RUN_ID="$EVENT_RUN_ID"
          else
            RUN_ID="$(gh run list --workflow "Flutter checks" --branch main --status success --limit 1 --json databaseId --jq '.[0].databaseId')"
          fi
          test -n "$RUN_ID"
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"

      - name: Download verified v0.6.12 artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ steps.build.outputs.run_id }}
        run: |
          mkdir -p release/windows release/android-mobile release/android-tv release/android-aab release/ios release/lg
          gh run download "$RUN_ID" -n SB-Player-Setup-v0.6.12 -D release/windows
          gh run download "$RUN_ID" -n SB-Player-Android-Mobile-v0.6.12 -D release/android-mobile
          gh run download "$RUN_ID" -n SB-Player-Android-TV-v0.6.12 -D release/android-tv
          gh run download "$RUN_ID" -n SB-Player-Android-Mobile-AAB-v0.6.12 -D release/android-aab
          gh run download "$RUN_ID" -n SB-Player-iOS-v0.6.12-unsigned-IPA -D release/ios
          gh run download "$RUN_ID" -n SB-Player-LG-v0.6.12 -D release/lg

      - name: Collect release files
        run: |
          cp release/windows/SB-Player-Setup-v0.6.12.exe release/SB-Player-Setup-v0.6.12.exe
          cp release/android-mobile/SB-Player-Android-Mobile-v0.6.12.apk release/SB-Player-Android-Mobile-v0.6.12.apk
          cp release/android-tv/SB-Player-Android-TV-v0.6.12.apk release/SB-Player-Android-TV-v0.6.12.apk
          cp release/android-aab/SB-Player-Android-Mobile-v0.6.12.aab release/SB-Player-Android-Mobile-v0.6.12.aab
          cp release/ios/SB-Player-iOS-v0.6.12-unsigned.ipa release/SB-Player-iOS-v0.6.12-unsigned.ipa
          cp release/lg/SB-Player-LG-v0.6.12.ipk release/SB-Player-LG-v0.6.12.ipk

      - name: Publish or update v0.6.12
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          if gh release view v0.6.12 >/dev/null 2>&1; then
            gh release upload v0.6.12               release/SB-Player-Setup-v0.6.12.exe               release/SB-Player-Android-Mobile-v0.6.12.apk               release/SB-Player-Android-TV-v0.6.12.apk               release/SB-Player-Android-Mobile-v0.6.12.aab               release/SB-Player-iOS-v0.6.12-unsigned.ipa               release/SB-Player-LG-v0.6.12.ipk               --clobber
          else
            gh release create v0.6.12               release/SB-Player-Setup-v0.6.12.exe               release/SB-Player-Android-Mobile-v0.6.12.apk               release/SB-Player-Android-TV-v0.6.12.apk               release/SB-Player-Android-Mobile-v0.6.12.aab               release/SB-Player-iOS-v0.6.12-unsigned.ipa               release/SB-Player-LG-v0.6.12.ipk               --target main               --title "SB Player v0.6.12"               --notes "SB Player v0.6.12 focuses on responsiveness across Android, iOS, Windows, Android TV and LG webOS. Includes lazy Series category loading, lower artwork decode costs, one Continue Watching card per series, watched/progress indicators for episodes, series-level favourites, distinct category artwork and the existing playback/PiP/autoplay fixes. The iOS IPA is unsigned and must be signed before installation."
          fi
