name: iOS PiP hotfix build

on:
  push:
    branches: [ios-pip-hotfix]

jobs:
  ios-build:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Create iOS platform
        run: |
          flutter create --project-name sb_player --platforms=ios .
          rm -f test/widget_test.dart
      - name: Configure iOS
        run: |
          /usr/libexec/PlistBuddy -c "Set :CFBundleDisplayName SB Player" ios/Runner/Info.plist || /usr/libexec/PlistBuddy -c "Add :CFBundleDisplayName string 'SB Player'" ios/Runner/Info.plist
          /usr/libexec/PlistBuddy -c "Add :UIBackgroundModes array" ios/Runner/Info.plist || true
          /usr/libexec/PlistBuddy -c "Add :UIBackgroundModes:0 string audio" ios/Runner/Info.plist || true
          /usr/libexec/PlistBuddy -c "Add :NSAppTransportSecurity dict" ios/Runner/Info.plist || true
          /usr/libexec/PlistBuddy -c "Add :NSAppTransportSecurity:NSAllowsArbitraryLoads bool true" ios/Runner/Info.plist || /usr/libexec/PlistBuddy -c "Set :NSAppTransportSecurity:NSAllowsArbitraryLoads true" ios/Runner/Info.plist
      - run: flutter pub get
      - name: Patch media_kit iOS same-player PiP
        run: python3 scripts/patch_ios_media_kit_pip.py
      - name: Verify patched iOS plugin source
        run: |
          PACKAGE_ROOT="$(python3 - <<'PY'
          import json
          from pathlib import Path
          from urllib.parse import unquote, urlparse
          cfg = json.loads(Path(".dart_tool/package_config.json").read_text())
          entry = next(x for x in cfg["packages"] if x["name"] == "media_kit_video")
          uri = entry["rootUri"]
          print(unquote(urlparse(uri).path) if uri.startswith("file:") else (Path(".dart_tool") / uri).resolve())
          PY
          )"
          PLUGIN="$PACKAGE_ROOT/ios/media_kit_video/Sources/media_kit_video/plugin/common/MediaKitVideoPlugin.swift"
          grep -F 'sb_player/media_kit_pip' "$PLUGIN"
          grep -F 'SBPlayerPiP.IsSupported' "$PLUGIN"
      - name: Analyze
        run: flutter analyze
      - name: Build unsigned iOS release
        run: flutter build ios --release --no-codesign
      - name: Verify PiP bridge is compiled into native framework
        run: |
          BIN="build/ios/iphoneos/Runner.app/Frameworks/media_kit_video.framework/media_kit_video"
          test -f "$BIN"
          strings "$BIN" | grep -F 'sb_player/media_kit_pip'
          strings "$BIN" | grep -F 'SBPlayerPiP.IsSupported'
      - name: Package unsigned IPA
        run: |
          mkdir -p Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -qry SB-Player-iOS-v0.6.6-pip3-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: SB-Player-iOS-v0.6.6-pip3-unsigned-IPA
          path: SB-Player-iOS-v0.6.6-pip3-unsigned.ipa
          if-no-files-found: error
          retention-days: 14
