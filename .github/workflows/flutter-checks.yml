name: Flutter checks

on:
  workflow_dispatch:
  push:
    branches: [main, v0.5-branding-installer, v0.6-ios, v0.6-unified]
  pull_request:

concurrency:
  group: flutter-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  windows-build:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter config --enable-windows-desktop
      - run: flutter create --project-name sb_player --platforms=windows .
      - name: Generate SB Player Windows icon
        shell: pwsh
        run: ./scripts/generate_windows_brand_icon.ps1
      - run: flutter pub get
      - run: flutter build windows --release
      - name: Capture real Windows UI screenshots
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path screenshots | Out-Null
          Add-Type -AssemblyName System.Windows.Forms
          Add-Type -AssemblyName System.Drawing
          $exe = Resolve-Path "build/windows/x64/runner/Release/sb_player.exe"
          function Capture-Screen([string]$Path) {
            $bounds = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
            $bitmap = New-Object System.Drawing.Bitmap $bounds.Width, $bounds.Height
            $graphics = [System.Drawing.Graphics]::FromImage($bitmap)
            $graphics.CopyFromScreen($bounds.Location, [System.Drawing.Point]::Empty, $bounds.Size)
            $bitmap.Save((Join-Path $PWD $Path), [System.Drawing.Imaging.ImageFormat]::Png)
            $graphics.Dispose(); $bitmap.Dispose()
          }
          $sections = @('home','live','guide','movies','series','continueWatching','favorites','recent')
          $index = 1
          foreach ($section in $sections) {
            $env:SB_PLAYER_UI_CAPTURE = '1'
            $env:SB_PLAYER_CAPTURE_SECTION = $section
            $process = Start-Process $exe -PassThru
            Start-Sleep -Seconds 6
            Capture-Screen ("screenshots/{0:D2}-{1}.png" -f $index,$section)
            Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
            Start-Sleep -Seconds 1
            $index++
          }
      - name: Upload real Windows UI screenshots
        uses: actions/upload-artifact@v4
        with:
          name: SB-Player-Windows-UI-Screenshots
          path: screenshots/*.png
          if-no-files-found: error
          retention-days: 14
      - name: Upload portable Windows release
        uses: actions/upload-artifact@v4
        with:
          name: SB-Player-Windows-Open-v0.6.5
          path: build/windows/x64/runner/Release/**
          if-no-files-found: error
          retention-days: 14
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --yes --no-progress
      - name: Build Windows installer
        shell: pwsh
        run: '& "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "installer\SBPlayer.iss"'
      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: SB-Player-Setup-v0.6.5
          path: dist/SB-Player-Setup-v0.6.5.exe
          if-no-files-found: error
          retention-days: 14


  ios-build:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Create iOS platform
        run: flutter create --project-name sb_player --platforms=ios .
      - name: Configure iOS branding and PiP
        run: |
          /usr/libexec/PlistBuddy -c "Set :CFBundleDisplayName SB Player" ios/Runner/Info.plist || /usr/libexec/PlistBuddy -c "Add :CFBundleDisplayName string 'SB Player'" ios/Runner/Info.plist
          /usr/libexec/PlistBuddy -c "Add :UIBackgroundModes array" ios/Runner/Info.plist || true
          /usr/libexec/PlistBuddy -c "Add :UIBackgroundModes:0 string audio" ios/Runner/Info.plist || true
          /usr/libexec/PlistBuddy -c "Add :NSAppTransportSecurity dict" ios/Runner/Info.plist || true
          /usr/libexec/PlistBuddy -c "Add :NSAppTransportSecurity:NSAllowsArbitraryLoads bool true" ios/Runner/Info.plist || /usr/libexec/PlistBuddy -c "Set :NSAppTransportSecurity:NSAllowsArbitraryLoads true" ios/Runner/Info.plist
          /usr/libexec/PlistBuddy -c "Add :NSCameraUsageDescription string 'Scan the QR code on your TV to securely link SB Player.'" ios/Runner/Info.plist || /usr/libexec/PlistBuddy -c "Set :NSCameraUsageDescription 'Scan the QR code on your TV to securely link SB Player.'" ios/Runner/Info.plist
          python3 - <<'PY'
          import struct,zlib,binascii,glob,json,os
          W=H=1024; bg=(4,5,9); blue=(24,160,255); purple=(122,77,255)
          rows=[bytearray(bg*W) for _ in range(H)]
          def rect(x0,y0,x1,y1,col):
              block=bytes(col)
              for y in range(y0,y1):
                  row=rows[y]
                  for x in range(x0,x1): row[x*3:x*3+3]=block
          rect(150,180,440,270,blue); rect(150,270,240,470,blue); rect(150,470,440,560,blue); rect(350,560,440,760,blue); rect(150,760,440,850,blue)
          rect(520,180,610,850,purple); rect(610,180,790,270,purple); rect(610,470,790,560,purple); rect(610,760,790,850,purple); rect(760,250,850,490,purple); rect(760,540,850,780,purple)
          raw=b''.join(b'\\x00'+bytes(r) for r in rows)
          def chunk(t,d): return struct.pack('>I',len(d))+t+d+struct.pack('>I',binascii.crc32(t+d)&0xffffffff)
          png=b'\\x89PNG\\r\\n\\x1a\\n'+chunk(b'IHDR',struct.pack('>IIBBBBB',W,H,8,2,0,0,0))+chunk(b'IDAT',zlib.compress(raw,9))+chunk(b'IEND',b'')
          src='/tmp/sb.png'; open(src,'wb').write(png)
          app='ios/Runner/Assets.xcassets/AppIcon.appiconset'
          data=json.load(open(os.path.join(app,'Contents.json')))
          scales={'1x':1,'2x':2,'3x':3}
          for image in data['images']:
              name=image.get('filename')
              if not name: continue
              points=float(image['size'].split('x')[0]); px=round(points*scales[image['scale']])
              os.system(f"sips -z {px} {px} {src} --out '{os.path.join(app,name)}' >/dev/null")
          PY
      - run: flutter pub get
      - name: Patch media_kit iOS same-player PiP
        run: python3 scripts/patch_ios_media_kit_pip.py
      - name: Build unsigned iOS release
        run: flutter build ios --release --no-codesign
      - name: Package unsigned IPA
        run: |
          mkdir -p Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -qry SB-Player-iOS-v0.6.5-pip3-unsigned.ipa Payload
      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: SB-Player-iOS-v0.6.5-pip3-unsigned-IPA
          path: SB-Player-iOS-v0.6.5-pip3-unsigned.ipa
          if-no-files-found: error
          retention-days: 14

  android-build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Create Android platform
        run: flutter create --project-name sb_player --platforms=android .
      - name: Configure Android PiP and TV support
        run: |
          manifest=android/app/src/main/AndroidManifest.xml
          sed -i 's/android:name=".MainActivity"/android:name=".MainActivity" android:supportsPictureInPicture="true"/' "$manifest"
          sed -i '/<application/i\    <uses-feature android:name="android.hardware.touchscreen" android:required="false" />\n    <uses-feature android:name="android.software.leanback" android:required="false" />' "$manifest"
          sed -i '/android.intent.category.LAUNCHER/a\                <category android:name="android.intent.category.LEANBACK_LAUNCHER"/>' "$manifest"
          main=$(find android/app/src/main/kotlin -name MainActivity.kt | head -1)
          sed -i 's/import io.flutter.embedding.android.FlutterActivity/import io.flutter.embedding.android.FlutterFragmentActivity/' "$main"
          sed -i 's/: FlutterActivity()/: FlutterFragmentActivity()/' "$main"
      - run: flutter pub get
      - name: Build Android Mobile APK
        run: |
          flutter build apk --release
          cp build/app/outputs/flutter-apk/app-release.apk SB-Player-Android-Mobile-v0.6.5.apk
      - name: Build Android Mobile App Bundle
        run: |
          flutter build appbundle --release
          cp build/app/outputs/bundle/release/app-release.aab SB-Player-Android-Mobile-v0.6.5.aab
      - name: Build Android TV APK
        run: |
          flutter build apk --release --dart-define=SB_ANDROID_TV=true
          cp build/app/outputs/flutter-apk/app-release.apk SB-Player-Android-TV-v0.6.5.apk
      - uses: actions/upload-artifact@v4
        with:
          name: SB-Player-Android-Mobile-v0.6.5
          path: SB-Player-Android-Mobile-v0.6.5.apk
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: SB-Player-Android-Mobile-AAB-v0.6.5
          path: SB-Player-Android-Mobile-v0.6.5.aab
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: SB-Player-Android-TV-v0.6.5
          path: SB-Player-Android-TV-v0.6.5.apk
          if-no-files-found: error
          retention-days: 14
