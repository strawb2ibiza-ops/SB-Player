name: Flutter checks

on:
  push:
    branches: [main, v0.5-branding-installer, v0.6-ios, v0.6-unified]
  pull_request:

concurrency:
  group: flutter-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  windows-build:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter config --enable-windows-desktop
      - run: flutter create --project-name sb_player --platforms=windows .
      - name: Generate SB Player Windows icon
        shell: pwsh
        run: ./scripts/generate_windows_brand_icon.ps1
      - run: flutter pub get
      - run: flutter build windows --release
      - name: Capture real Windows UI screenshots
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path screenshots | Out-Null
          Add-Type -AssemblyName System.Windows.Forms
          Add-Type -AssemblyName System.Drawing
          $exe = Resolve-Path "build/windows/x64/runner/Release/sb_player.exe"
          function Capture-Screen([string]$Path) {
            $bounds = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
            $bitmap = New-Object System.Drawing.Bitmap $bounds.Width, $bounds.Height
            $graphics = [System.Drawing.Graphics]::FromImage($bitmap)
            $graphics.CopyFromScreen($bounds.Location, [System.Drawing.Point]::Empty, $bounds.Size)
            $bitmap.Save((Join-Path $PWD $Path), [System.Drawing.Imaging.ImageFormat]::Png)
            $graphics.Dispose(); $bitmap.Dispose()
          }
          $sections = @('home','live','guide','movies','series','continueWatching','favorites','recent')
          $index = 1
          foreach ($section in $sections) {
            $env:SB_PLAYER_UI_CAPTURE = '1'
            $env:SB_PLAYER_CAPTURE_SECTION = $section
            $process = Start-Process $exe -PassThru
            Start-Sleep -Seconds 6
            Capture-Screen ("screenshots/{0:D2}-{1}.png" -f $index,$section)
            Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
            Start-Sleep -Seconds 1
            $index++
          }
      - name: Upload real Windows UI screenshots
        uses: actions/upload-artifact@v4
        with:
          name: SB-Player-Windows-UI-Screenshots
          path: screenshots/*.png
          if-no-files-found: error
          retention-days: 14
      - name: Upload portable Windows release
        uses: actions/upload-artifact@v4
        with:
          name: SB-Player-Windows-Open-v0.5
          path: build/windows/x64/runner/Release/**
          if-no-files-found: error
          retention-days: 14
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --yes --no-progress
      - name: Build Windows installer
        shell: pwsh
        run: '& "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "installer\SBPlayer.iss"'
      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: SB-Player-Setup-v0.5.0
          path: dist/SB-Player-Setup-v0.5.0.exe
          if-no-files-found: error
          retention-days: 14


  ios-build:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Create iOS platform
        run: flutter create --project-name sb_player --platforms=ios .
      - run: flutter pub get
      - name: Build unsigned iOS release
        run: flutter build ios --release --no-codesign
      - name: Package unsigned IPA
        run: |
          mkdir -p Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -qry SB-Player-iOS-v0.6-unsigned.ipa Payload
      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: SB-Player-iOS-v0.6-unsigned-IPA
          path: SB-Player-iOS-v0.6-unsigned.ipa
          if-no-files-found: error
          retention-days: 14

  android-build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Create Android platform
        run: flutter create --project-name sb_player --platforms=android .
      - run: flutter pub get
      - name: Build Android APK
        run: flutter build apk --release
      - name: Build Android App Bundle
        run: flutter build appbundle --release
      - uses: actions/upload-artifact@v4
        with:
          name: SB-Player-Android-v0.6-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: SB-Player-Android-v0.6-AAB
          path: build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 14
