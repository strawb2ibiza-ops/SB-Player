name: sb_player
description: Cross-platform IPTV player with open and SB-locked provider modes.
publish_to: 'none'
version: 0.6.3+7

environment:
  sdk: '>=3.8.0 <4.0.0'
  flutter: '>=3.32.0'

dependencies:
  crypto: ^3.0.7
  cryptography: ^2.7.0
  flutter:
    sdk: flutter
  flutter_secure_storage: ^11.2.0
  http: ^1.6.0
  media_kit: ^1.2.6
  media_kit_video: ^2.0.1
  media_kit_libs_video: ^1.0.7
  mobile_scanner: ^7.0.1
  native_picture_in_picture: ^1.0.1
  shared_preferences: ^2.5.3
  path_provider: ^2.1.5
  window_manager: ^0.5.2
  xml: ^6.6.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
