<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>SB Player</title><link rel="stylesheet" href="style.css"></head>
<body>
<div id="app">
  <header><div class="brand"><b>SB</b><span>Player</span></div><div id="status"></div></header>
  <main>
    <section id="login" class="panel">
      <h1>Welcome to SB Player</h1><p>Sign in with your Xtream-compatible IPTV account.</p>
      <label>Server URL<input id="server" placeholder="http://provider.example:8080"></label>
      <label>Username<input id="username" autocomplete="username"></label>
      <label>Password<input id="password" type="password" autocomplete="current-password"></label>
      <button id="signin" class="focusable">Sign in</button><div id="error"></div>
    </section>
    <section id="home" class="hidden">
      <aside><button data-view="live" class="nav focusable active">Live TV</button><button data-view="movies" class="nav focusable">Movies</button><button data-view="series" class="nav focusable">Series</button><button id="logout" class="nav focusable">Sign out</button></aside>
      <div class="content"><div class="toolbar"><h2 id="heading">Live TV</h2><input id="search" class="focusable" placeholder="Search"></div><div id="categories" class="categories"></div><div id="grid" class="grid"></div></div>
    </section>
  </main>
</div>
<div id="player" class="hidden"><video id="video" autoplay controls></video><div class="playerTop"><button id="back" class="focusable">← Back</button><span id="playingTitle"></span></div></div>
<script src="app.js"></script></body></html>
